name: Yang Linux build (.deb/.rpm/.AppImage)

on:
  workflow_dispatch:
  push:
    tags:
      - "yang-v*"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/yang/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/yang/src-tauri

      - run: npm ci
        working-directory: apps/yang

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/yang
          args: --bundles deb,rpm,appimage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitsune-yang-linux
          path: |
            apps/yang/src-tauri/target/release/bundle/deb/*.deb
            apps/yang/src-tauri/target/release/bundle/rpm/*.rpm
            apps/yang/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
