name: Yang Windows build (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - "yang-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/yang/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/yang/src-tauri

      - run: npm ci
        working-directory: apps/yang

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/yang
          args: --bundles nsis

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitsune-yang-windows
          path: |
            apps/yang/src-tauri/target/release/bundle/nsis/*.exe
            apps/yang/src-tauri/target/release/kitsune-yang.exe
          if-no-files-found: warn
