<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 26px;
      background:
        radial-gradient(1100px 500px at 50% -10%, rgba(122,162,247,.20), transparent 60%),
        radial-gradient(900px 500px at 85% 110%, rgba(180,120,220,.14), transparent 60%),
        radial-gradient(900px 500px at 10% 110%, rgba(90,200,170,.12), transparent 60%),
        light-dark(#eef0f4, #161618);
      color: light-dark(#1a1a1a, #e8e8ea);
    }
    #clock { font-size: 64px; font-weight: 200; letter-spacing: 2px; opacity: .9; }
    #date { font-size: 15px; opacity: .55; margin-top: -18px; }
    form { width: min(520px, 78vw); }
    input {
      width: 100%; padding: 13px 20px; font-size: 16px;
      border-radius: 999px; border: 1px solid light-dark(#ddd, #333);
      background: light-dark(rgba(255,255,255,.8), rgba(30,30,33,.85));
      color: inherit; outline: none;
    }
    input:focus { border-color: #7aa2f7; }
  </style>
</head>
<body>
  <div id="clock">--:--</div>
  <div id="date"></div>
  <!-- Sin JS de navegación: el form va directo al buscador. -->
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" type="text" placeholder="Buscar en la web..." autocomplete="off" spellcheck="false" autofocus />
  </form>
  <script>
    function tick() {
      const d = new Date();
      document.getElementById('clock').textContent =
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      document.getElementById('date').textContent =
        d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    }
    tick();
    setInterval(tick, 10000);
  </script>
</body>
</html>
