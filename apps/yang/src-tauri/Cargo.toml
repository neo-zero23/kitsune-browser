[package]
name = "kitsune-yang"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable": necesario para WebviewBuilder + Window::add_child (tabs como webviews hijo).
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Solo Linux: overlay GtkFixed + webkit2gtk para posicionado absoluto.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

# Release LTS para PCs patata: binario chico y de bajo consumo.
# (lto thin en vez de fat: buen balance sin builds eternos)
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
