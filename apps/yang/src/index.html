<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitsune Yang</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Chrome siempre visible: tabstrip + toolbar -->
  <div id="chrome">
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="new-tab" title="Nueva pestaña (Ctrl+T)">+</button>
    </div>
    <div id="toolbar">
      <button id="btn-back" title="Atrás">←</button>
      <button id="btn-fwd" title="Adelante">→</button>
      <button id="btn-reload" title="Recargar">⟳</button>
      <input id="urlbar" type="text" placeholder="Buscar o escribir dirección" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <div id="status" class="hidden"></div>
  <script src="./main.js"></script>
</body>
</html>
